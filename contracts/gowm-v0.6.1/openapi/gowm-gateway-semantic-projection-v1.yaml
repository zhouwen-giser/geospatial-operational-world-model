openapi: 3.1.0
info:
  title: GOWM Capability Semantic Projection
  version: 1.0.0
paths:
  /v1/capability-semantics:
    get:
      operationId: listCapabilitySemantics
      responses:
        "200":
          description: Semantic projection of the approved Capability Registry
          content:
            application/json:
              schema:
                $ref: ../contracts/capability-semantic-catalog.schema.json
  /v1/capability-semantics/{operationId}/{operationVersion}:
    get:
      operationId: getCapabilitySemanticProfile
      parameters:
        - in: path
          name: operationId
          required: true
          schema: { type: string }
        - in: path
          name: operationVersion
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Capability semantic profile
          content:
            application/json:
              schema:
                $ref: ../contracts/capability-semantic-profile.schema.json
