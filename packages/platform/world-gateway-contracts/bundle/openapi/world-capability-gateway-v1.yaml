openapi: 3.1.0
info:
  title: GOWM World Capability Gateway
  version: 0.2.0
  description: Public API. Identity and data-scope claims are transport-derived and are not body fields.
paths:
  /v1/capabilities:
    get:
      operationId: listCapabilities
      responses:
        "200":
          description: Controlled capability catalog
          content:
            application/json:
              schema:
                $ref: ../capability-list-response.schema.json
  /v1/capabilities/{operationId}:
    get:
      operationId: getCapability
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Versioned capability registration
          content:
            application/json:
              schema:
                $ref: ../capability-versions-response.schema.json
        "404":
          $ref: "#/components/responses/PlatformError"
  /v1/operations/{operationId}:execute:
    post:
      operationId: executeCapability
      parameters:
        - $ref: "#/components/parameters/OperationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../gateway-execute-request.schema.json
      responses:
        "200":
          description: Completed capability result
          content:
            application/json:
              schema:
                $ref: ../capability-result-envelope.schema.json
        "202":
          description: Asynchronous job accepted
          content:
            application/json:
              schema:
                $ref: ../job-record.schema.json
        "400":
          $ref: "#/components/responses/PlatformError"
        "403":
          $ref: "#/components/responses/PlatformError"
        "409":
          $ref: "#/components/responses/PlatformError"
  /v1/world-queries:
    post:
      operationId: submitWorldQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../world-query-submission.schema.json
      responses:
        "200":
          description: Synchronous world-query result
          content:
            application/json:
              schema:
                $ref: ../world-query-result.schema.json
        "202":
          description: World-query job accepted
          content:
            application/json:
              schema:
                $ref: ../job-record.schema.json
        "400":
          $ref: "#/components/responses/PlatformError"
  /v1/world-queries/{queryId}:
    get:
      operationId: getWorldQuery
      parameters:
        - $ref: "#/components/parameters/QueryId"
      responses:
        "200":
          description: World-query job status/result
          content:
            application/json:
              schema:
                $ref: ../job-record.schema.json
        "404":
          $ref: "#/components/responses/PlatformError"
  /v1/world-queries/{queryId}:cancel:
    post:
      operationId: cancelWorldQuery
      parameters:
        - $ref: "#/components/parameters/QueryId"
      responses:
        "200":
          description: Cancelled or terminal world-query job
          content:
            application/json:
              schema:
                $ref: ../job-record.schema.json
        "409":
          $ref: "#/components/responses/PlatformError"
  /v1/jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Direct-operation or world-query job
          content:
            application/json:
              schema:
                $ref: ../job-record.schema.json
        "404":
          $ref: "#/components/responses/PlatformError"
  /v1/receipts/{receiptId}:
    get:
      operationId: getReceipt
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Append-only execution receipt
          content:
            application/json:
              schema:
                $ref: ../execution-receipt.schema.json
        "404":
          $ref: "#/components/responses/PlatformError"
components:
  parameters:
    OperationId:
      in: path
      name: operationId
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9.-]{2,127}$
    QueryId:
      in: path
      name: queryId
      required: true
      schema:
        type: string
        maxLength: 256
    JobId:
      in: path
      name: jobId
      required: true
      schema:
        type: string
        maxLength: 256
    ReceiptId:
      in: path
      name: receiptId
      required: true
      schema:
        type: string
        maxLength: 256
  responses:
    PlatformError:
      description: Fail-closed platform error
      content:
        application/json:
          schema:
            $ref: ../platform-error.schema.json
