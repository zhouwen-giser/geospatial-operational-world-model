name: GOWM v0.7.1 exact-head qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gowm-v071-exact-head-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-required-check:
    name: gowm-v071-candidate-required-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOWM_V071_DATABASE_CONTAINER: gowm-v071-candidate-db-${{ github.run_id }}-${{ github.run_attempt }}
      STAS_DB_PASSWORD: v071_ci_stas_password_20260830
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Static candidate qualification
        run: npm run verify

      - name: Build and start isolated candidate database
        run: |
          database="$GOWM_V071_DATABASE_CONTAINER"
          docker build --file database/Dockerfile --tag "gowm-v071-candidate-db:${GITHUB_SHA}" .
          docker run --detach --name "$database" \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_DB=gowm --env POSTGRES_USER=gowm --env POSTGRES_PASSWORD=gowm \
            "gowm-v071-candidate-db:${GITHUB_SHA}"
          for attempt in $(seq 1 60); do
            if docker exec "$database" sh -ec 'test "$(head -1 "${PGDATA}/postmaster.pid")" = 1 && pg_isready -h 127.0.0.1 -U gowm -d gowm >/dev/null && test "$(psql -h 127.0.0.1 -U gowm -d gowm -Atqc "SELECT 1")" = 1'; then break; fi
            if [ "$attempt" = 60 ]; then docker logs "$database"; exit 1; fi
            sleep 2
          done
          host_port="$(docker port "$database" 5432/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          echo "DATABASE_ADMIN_URL=postgresql://gowm:gowm@127.0.0.1:${host_port}/gowm" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://gowm:gowm@127.0.0.1:${host_port}/gowm" >> "$GITHUB_ENV"

      - name: Candidate 001-to-069 and 067-to-069 database qualification
        run: npm run validate:v071-database-upgrade

      - name: Candidate P1 Gateway scenario qualification
        run: npm run validate:v07-history-gateway

      - name: Stop isolated candidate database
        if: always()
        run: docker rm --force --volumes "$GOWM_V071_DATABASE_CONTAINER" || true

  qualify:
    name: gowm-v071-exact-head-qualification
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOWM_V071_QUALIFICATION_NETWORK: gowm-v071-${{ github.run_id }}-${{ github.run_attempt }}
      GOWM_V071_DATABASE_CONTAINER: gowm-v071-db-${{ github.run_id }}-${{ github.run_attempt }}
      STAS_DB_PASSWORD: v071_ci_stas_password_20260830
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure exact-head evidence paths
        run: |
          echo "GOWM_V071_ARTIFACT_ROOT=${RUNNER_TEMP}/exact-head-artifact" >> "$GITHUB_ENV"
          echo "GOWM_V071_EVIDENCE_ROOT=${RUNNER_TEMP}/exact-head-artifact/reports/gowm-v0.7.1/${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Initialize exact-source evidence
        run: node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs initialize

      - name: Static protocol closure
        run: >-
          node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs run
          protocol-closure-report "check, SQL, tests and build"
          -- npm run verify

      - name: Deterministic locale matrix
        run: >-
          node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs run
          deterministic-hash-report "Unicode code-point canonical ordering locale matrix"
          -- npm run validate:v071-canonical-order

      - name: Build exact-source database and application images
        run: |
          docker build --file database/Dockerfile --tag "gowm-v071-db:${GITHUB_SHA}" .
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "gowm-v071-app:${GITHUB_SHA}" .

      - name: Start isolated qualification database
        id: database
        run: |
          network="$GOWM_V071_QUALIFICATION_NETWORK"
          database="$GOWM_V071_DATABASE_CONTAINER"
          docker network create "$network"
          docker run --detach --name "$database" --network "$network" --network-alias postgres \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_DB=gowm --env POSTGRES_USER=gowm --env POSTGRES_PASSWORD=gowm \
            "gowm-v071-db:${GITHUB_SHA}"
          for attempt in $(seq 1 60); do
            if docker exec "$database" sh -ec 'test "$(head -1 "${PGDATA}/postmaster.pid")" = 1 && pg_isready -h 127.0.0.1 -U gowm -d gowm >/dev/null && test "$(psql -h 127.0.0.1 -U gowm -d gowm -Atqc "SELECT 1")" = 1'; then break; fi
            if [ "$attempt" = 60 ]; then docker logs "$database"; exit 1; fi
            sleep 2
          done
          host_port="$(docker port "$database" 5432/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          echo "DATABASE_ADMIN_URL=postgresql://gowm:gowm@127.0.0.1:${host_port}/gowm" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://gowm:gowm@127.0.0.1:${host_port}/gowm" >> "$GITHUB_ENV"
          echo "GOWM_V071_QUALIFICATION_IMAGE=gowm-v071-app:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GOWM_V071_MAIN_DATABASE_URL=postgresql://gowm:gowm@postgres:5432/gowm" >> "$GITHUB_ENV"

      - name: Migrate persistent worker qualification database
        run: npm run db:migrate

      - name: Fresh 001-to-069 and 067-to-069 database gates
        run: >-
          node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs run
          database-fresh-report "fresh install 001 through 069 and upgrade 067 through 069"
          -- npm run validate:v071-database-upgrade

      - name: Bind upgrade evidence to the same database execution
        run: >-
          node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs alias
          database-upgrade-report database-fresh-report
          "migration 067 through 069 with frozen predecessor ledgers and checksum-stable replay"

      - name: Real Gateway two-provider DAG gate
        run: >-
          node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs run
          gateway-runtime-report "Operational interval to Historical trajectory Gateway DAG"
          -- npm run validate:v07-history-gateway

      - name: Bind historical DAG evidence to the same execution
        run: >-
          node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs alias
          historical-two-provider-dag-report gateway-runtime-report
          "Operational Reality Provider to Task Execution Interval to Historical Trace Provider"

      - name: Bind downgraded actual-resource retention evidence to the same execution
        run: >-
          node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs alias
          snapshot-downgrade-resource-retention-report gateway-runtime-report
          "LATEST_AT_START authorized downgrade retains actual Provider resources without pinning strengthening"

      - name: Bind current-event-set advancement evidence to the same execution
        run: >-
          node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs alias
          historical-event-set-advancement-report gateway-runtime-report
          "pending interval input set remains stable while the current visible event set advances and later catches up"

      - name: Node adherence persistence and restart gate
        run: >-
          node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs run
          node-adherence-report "two-node adherence, persisted effective snapshot and restart"
          -- npm run validate:v071-node-adherence-restart

      - name: Container-level worker backoff and recovery gate
        run: >-
          node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs run
          worker-backoff-report "real container database failure, bounded backoff, signal and recovery"
          -- npm run validate:v071-worker-backoff-container

      - name: Record honest Artifact deferral
        run: node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs defer-artifact

      - name: Finalize exact-head runtime qualification
        run: node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs finalize-runtime

      - name: Generate exact-head WSGS Historical Consumer Baseline
        run: npm run validate:v071-wsgs-historical-lock

      - name: Finalize exact-head closure
        run: node --import tsx validation/scripts/gowm-v071-exact-head-evidence.mjs finalize

      - name: Stop isolated qualification resources
        if: always()
        run: |
          if [ -n "${GOWM_V071_DATABASE_CONTAINER:-}" ]; then docker rm --force --volumes "$GOWM_V071_DATABASE_CONTAINER" || true; fi
          if [ -n "${GOWM_V071_QUALIFICATION_NETWORK:-}" ]; then docker network rm "$GOWM_V071_QUALIFICATION_NETWORK" || true; fi

      - name: Upload immutable exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gowm-v0.7.1-exact-head-${{ github.sha }}
          path: ${{ env.GOWM_V071_ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 90
