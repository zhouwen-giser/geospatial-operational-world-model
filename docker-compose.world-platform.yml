      PROVIDER_HEALTH_PORT: '8087'
      GEOMETRY_BRIDGE_PORT: '8087'
      GEOMETRY_BRIDGE_UPSTREAM_BASE_URL: ${GEOMETRY_BRIDGE_UPSTREAM_BASE_URL:-}
      GEOMETRY_BRIDGE_INTEGRATION_VERSION: ${GEOMETRY_BRIDGE_INTEGRATION_VERSION:-}
      GEOMETRY_BRIDGE_MAX_QUEUE_SIZE: ${GEOMETRY_BRIDGE_MAX_QUEUE_SIZE:-}
      GEOMETRY_BRIDGE_GEOS_VERSION: ${GEOMETRY_BRIDGE_GEOS_VERSION:-}
      GEOMETRY_BRIDGE_ENDPOINT_CONFIGURATION_DIGEST: ${GEOMETRY_BRIDGE_ENDPOINT_CONFIGURATION_DIGEST:-}
      GEOMETRY_BRIDGE_MAX_IN_FLIGHT: ${GEOMETRY_BRIDGE_MAX_IN_FLIGHT:-}
      GEOMETRY_BRIDGE_ENDPOINT_APPROVAL_STATUS: ${GEOMETRY_BRIDGE_ENDPOINT_APPROVAL_STATUS:-}
      GEOMETRY_BRIDGE_ENDPOINT_ID: ${GEOMETRY_BRIDGE_ENDPOINT_ID:-}
  h3-analysis-provider:
