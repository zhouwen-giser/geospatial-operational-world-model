      PROVIDER_HEALTH_PORT: '8091'
      GROUNDING_CATALOG_MODE: dataset
      GROUNDING_CATALOG_PORT: '8091'
      GROUNDING_CATALOG_DATABASE_URL: postgresql://gowm_catalog_service:${CATALOG_DB_PASSWORD}@postgres:5432/gowm
      GROUNDING_CATALOG_CURSOR_HMAC_SECRET: ${GROUNDING_CURSOR_HMAC_SECRET:?set cursor secret}
  geometry-provider-bridge:
    image: gowm-world-platform:0.6.3
    build: *id001
    networks: *id002
    profiles:
