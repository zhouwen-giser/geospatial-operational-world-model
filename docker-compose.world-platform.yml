    - interactive
    environment:
      PROVIDER_TRANSPORT_SHARED_TOKEN: ${H3_INTERACTIVE_PROVIDER_TRANSPORT_TOKEN:?set H3_INTERACTIVE_PROVIDER_TRANSPORT_TOKEN}
      PROVIDER_HEALTH_PORT: '8088'
      H3_PROVIDER_PORT: '8088'
      H3_TOOLKIT_BINDINGS_MODULE: /opt/gowm/h3-bindings.mjs
      H3_TOOLKIT_BINDINGS_MODULE_SHA256: ${H3_TOOLKIT_BINDINGS_MODULE_SHA256:?build and set verified H3 artifact digest}
    volumes:
    - ${H3_TOOLKIT_BINDINGS_HOST_PATH:?build verified H3 artifact}:/opt/gowm/h3-bindings.mjs:ro
  network-provider:
