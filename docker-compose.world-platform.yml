# World Platform overlay. Only Gateway publishes a host port. Optional bridges require their own deployment attestations.
services:
  postgres:
    image: ${WORLD_PLATFORM_POSTGRES_IMAGE:-gowm-plus-db:18-3.6-mobilitydb-1.3-h3-4.5.0-pgrouting-4.0.1}
    ports: !reset []
  mqtt:
    ports: !reset []
    profiles:
    - foundation-admin
  world-api:
    ports: !reset []
    profiles:
    - foundation-admin
  observation-ingest:
    ports: !reset []
    profiles:
    - foundation-admin
  stas:
    ports: !reset []
    profiles:
    - foundation-admin
  world-mcp-server:
    ports: !reset []
    profiles:
    - foundation-admin
  projection-worker:
    profiles:
    - foundation-admin
  migrate:
    profiles:
    - foundation-admin
  world-platform-bootstrap:
    image: gowm-world-platform:0.6.3
    build: &id001
      context: .
      dockerfile: Dockerfile
    networks: &id002
    - default
    profiles: &id006
    - world-platform
    restart: 'no'
    init: true
    security_opt: &id003
    - no-new-privileges:true
    cap_drop: &id004
    - ALL
    read_only: true
    tmpfs: &id005
    - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    command:
    - node
    - dist/scripts/bootstrap-world-platform.js
    environment:
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set distinct GATEWAY_DB_PASSWORD}
      GATEWAY_REGISTRY_DB_PASSWORD: ${GATEWAY_REGISTRY_DB_PASSWORD:?set distinct GATEWAY_REGISTRY_DB_PASSWORD}
      SPATIAL_DB_PASSWORD: ${SPATIAL_DB_PASSWORD:?set distinct SPATIAL_DB_PASSWORD}
      SITUATION_DB_PASSWORD: ${SITUATION_DB_PASSWORD:?set distinct SITUATION_DB_PASSWORD}
      REFERENCE_DB_PASSWORD: ${REFERENCE_DB_PASSWORD:?set distinct REFERENCE_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set distinct CATALOG_DB_PASSWORD}
      EVIDENCE_DB_PASSWORD: ${EVIDENCE_DB_PASSWORD:?set distinct EVIDENCE_DB_PASSWORD}
      OPERATIONAL_DB_PASSWORD: ${OPERATIONAL_DB_PASSWORD:?set distinct OPERATIONAL_DB_PASSWORD}
      VALIDATION_DB_PASSWORD: ${VALIDATION_DB_PASSWORD:?set distinct VALIDATION_DB_PASSWORD}
      NETWORK_DB_PASSWORD: ${NETWORK_DB_PASSWORD:?set distinct NETWORK_DB_PASSWORD}
      ROUTE_DB_PASSWORD: ${ROUTE_DB_PASSWORD:?set distinct ROUTE_DB_PASSWORD}
      COVERAGE_DB_PASSWORD: ${COVERAGE_DB_PASSWORD:?set distinct COVERAGE_DB_PASSWORD}
      STAS_DB_PASSWORD: ${STAS_DB_PASSWORD:?set distinct STAS_DB_PASSWORD}
      DATABASE_URL: postgresql://gowm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/gowm
      GATEWAY_REGISTRY_DATABASE_URL: postgresql://gowm_gateway_registry_service:${GATEWAY_REGISTRY_DB_PASSWORD}@postgres:5432/gowm
      ANALYSIS_SRID: '32650'
  crs-provider-bridge:
    image: gowm-world-platform:0.6.3
    build: *id001
    networks: *id002
    profiles:
    - world-platform-bridges
    restart: unless-stopped
    init: true
    security_opt: *id003
    cap_drop: *id004
    read_only: true
    tmpfs: *id005
    depends_on: &id007
      world-platform-bootstrap:
        condition: service_completed_successfully
    healthcheck: &id008
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:'+process.env.PROVIDER_HEALTH_PORT+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    command:
    - node
    - dist/services/providers/crs-provider-bridge/src/index.js
    environment:
      PROVIDER_TRANSPORT_SHARED_TOKEN: ${CRS_PROVIDER_TRANSPORT_TOKEN:?set CRS_PROVIDER_TRANSPORT_TOKEN}
      PROVIDER_HEALTH_PORT: '8086'
      CRS_BRIDGE_PORT: '8086'
      CRS_BRIDGE_PROJ_DB_SHA256: ${CRS_BRIDGE_PROJ_DB_SHA256:-}
      CRS_BRIDGE_GRID_BUNDLE_VERSION: ${CRS_BRIDGE_GRID_BUNDLE_VERSION:-}
      CRS_BRIDGE_PROJ_VERSION: ${CRS_BRIDGE_PROJ_VERSION:-}
      CRS_BRIDGE_ENDPOINT_CONFIGURATION_DIGEST: ${CRS_BRIDGE_ENDPOINT_CONFIGURATION_DIGEST:-}
      CRS_BRIDGE_ENDPOINT_APPROVAL_STATUS: ${CRS_BRIDGE_ENDPOINT_APPROVAL_STATUS:-}
      CRS_BRIDGE_INTEGRATION_VERSION: ${CRS_BRIDGE_INTEGRATION_VERSION:-}
      CRS_BRIDGE_PROJ_DB_VERSION: ${CRS_BRIDGE_PROJ_DB_VERSION:-}
      CRS_BRIDGE_GRID_BUNDLE_SHA256: ${CRS_BRIDGE_GRID_BUNDLE_SHA256:-}
      CRS_BRIDGE_UPSTREAM_BASE_URL: ${CRS_BRIDGE_UPSTREAM_BASE_URL:-}
      CRS_BRIDGE_ENDPOINT_ID: ${CRS_BRIDGE_ENDPOINT_ID:-}
  dataset-catalog-provider:
    image: gowm-world-platform:0.6.3
    build: *id001
    networks: *id002
    profiles: *id006
    restart: unless-stopped
