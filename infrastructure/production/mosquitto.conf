# Internal transport remains private; both listeners require per-user ACLs.
per_listener_settings false
allow_anonymous false
password_file /run/gowm-ops/mqtt-passwords
acl_file /mosquitto/config/gowm.acl
listener 1883
protocol mqtt
listener 8883
protocol mqtt
certfile /run/gowm-ops/server-cert.pem
keyfile /run/gowm-ops/server-key.pem
cafile /run/gowm-ops/ca.pem
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_queued_messages 10000
max_inflight_messages 100
message_size_limit 10485760
log_dest stdout
log_type error
log_type warning
