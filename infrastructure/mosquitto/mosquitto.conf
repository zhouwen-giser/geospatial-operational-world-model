# PoC-only listener. Stage 1 must enable TLS, authentication and per-topic ACLs.
listener 1883
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

max_queued_messages 10000
max_inflight_messages 100
message_size_limit 10485760

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
