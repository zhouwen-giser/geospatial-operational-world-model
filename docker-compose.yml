name: ${COMPOSE_PROJECT_NAME:?set an isolated COMPOSE_PROJECT_NAME in .env}

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://gowm:${POSTGRES_PASSWORD:-gowm}@postgres:5432/gowm
  MQTT_URL: mqtt://mqtt:1883
  MQTT_CONNECT_TIMEOUT_MS: 3000
  MQTT_MESSAGE_EXPIRY_SEC: 86400
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
  SERVICE_NAME: ${SERVICE_NAME:-gowm}
  SERVICE_REVISION: ${SERVICE_REVISION:-dev}
  WORLD_API_URL: http://world-api:3000
  OBSERVATION_API_URL: http://observation-ingest:3002
  DEFAULT_H3_RESOLUTION: ${DEFAULT_H3_RESOLUTION:-9}
  STALE_AFTER_MS: 30000
  MAX_FUTURE_SKEW_MS: ${MAX_FUTURE_SKEW_MS:-300000}
  MAX_LATE_ARRIVAL_MS: ${MAX_LATE_ARRIVAL_MS:-86400000}
  SOURCE_PRIORITIES: camera:70,uav:80,ugv:75,sensor:60,operator:100,simulator:50
  ANALYSIS_SRID: ${ANALYSIS_SRID:-32650}
  ANALYSIS_SPACE_KEY: ${ANALYSIS_SPACE_KEY:-default}
  H3_PG_VERSION: ${H3_PG_VERSION:-4.5.0}
  PGROUTING_VERSION: ${PGROUTING_VERSION:-4.0.1}
  TRACKLET_MAX_TIME_GAP_MS: ${TRACKLET_MAX_TIME_GAP_MS:-10000}
  TRACKLET_MAX_DISTANCE_GAP_M: ${TRACKLET_MAX_DISTANCE_GAP_M:-250}
  TRACKLET_MAX_REQUIRED_SPEED_MPS: ${TRACKLET_MAX_REQUIRED_SPEED_MPS:-80}
  PROJECTION_BATCH_SIZE: ${PROJECTION_BATCH_SIZE:-200}
  PROJECTION_POLL_MS: ${PROJECTION_POLL_MS:-250}
  WORLD_API_COMPATIBILITY_MODE: ${WORLD_API_COMPATIBILITY_MODE:-legacy}
  WORLD_API_COMPATIBILITY_SUNSET: ${WORLD_API_COMPATIBILITY_SUNSET:-}
  WORLD_API_PARITY_ATTESTATIONS_JSON: ${WORLD_API_PARITY_ATTESTATIONS_JSON:-}
  STAS_DB_PASSWORD: ${STAS_DB_PASSWORD:?set STAS_DB_PASSWORD in .env}

services:
  postgres:
    build:
      context: .
      dockerfile: database/Dockerfile
      args:
        MOBILITYDB_BASE_IMAGE: ${MOBILITYDB_BASE_IMAGE:-mobilitydb/mobilitydb:18-3.6-1.3@sha256:8409e3897e2b88561bef4374110c3da5f7ff56838a7745315f1c2f111305dd24}
        H3_PG_VERSION: 4.5.0
        PGROUTING_VERSION: 4.0.1
        PGROUTING_SOURCE_SHA256: 21c071983a682e048da28f0f211205a20f27ef3708c0b637b4e6e29994d7d699
    image: gowm-plus-db:18-3.6-mobilitydb-1.3-h3-4.5.0-pgrouting-4.0.1
    environment:
      POSTGRES_DB: gowm
      POSTGRES_USER: gowm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gowm}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gowm-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "test \"$(head -1 \"$${PGDATA}/postmaster.pid\")\" = 1 && pg_isready -U gowm -d gowm && psql -U gowm -d gowm -Atqc \"SELECT count(*) FROM pg_available_extensions WHERE name IN ('postgis','mobilitydb','h3','h3_postgis','pgrouting')\" | grep -qx 5"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    shm_size: ${POSTGRES_SHM_SIZE:-1gb}
    stop_grace_period: 60s

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - gowm-mosquitto:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "gowm/health", "-m", "ping", "-q", "1"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  migrate:
    build: .
    environment:
      <<: *app-environment
      HISTORICAL_WORKER_DB_PASSWORD: ${HISTORICAL_WORKER_DB_PASSWORD:?set a distinct HISTORICAL_WORKER_DB_PASSWORD in .env}
    command: ["node", "dist/scripts/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  world-api:
    build: .
    environment:
      <<: *app-environment
      WORLD_API_PORT: 3000
    command: ["node", "dist/services/world-api/src/index.js"]
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${WORLD_API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    init: true

  observation-ingest:
    build: .
    environment:
      <<: *app-environment
      OBSERVATION_API_PORT: 3002
    command: ["node", "dist/services/observation-ingest/src/index.js"]
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${OBSERVATION_API_PORT:-3002}:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    init: true

  ugv-mqtt-ingest:
    build: .
    profiles: ["ugv-mqtt"]
    environment:
      DATABASE_URL: postgresql://gowm:${POSTGRES_PASSWORD:-gowm}@postgres:5432/gowm
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_REVISION: ${SERVICE_REVISION:-dev}
      UGV_MQTT_URL: ${UGV_MQTT_URL:-}
      UGV_MQTT_CLIENT_ID: ${UGV_MQTT_CLIENT_ID:-gowm-ugv-ingest-airport-01}
      UGV_MQTT_USERNAME: ${UGV_MQTT_USERNAME:-}
      UGV_MQTT_PASSWORD_FILE: ${UGV_MQTT_PASSWORD_CONTAINER_FILE:-}
      UGV_MQTT_CA_FILE: ${UGV_MQTT_CA_CONTAINER_FILE:-}
      UGV_MQTT_CERT_FILE: ${UGV_MQTT_CERT_CONTAINER_FILE:-}
      UGV_MQTT_KEY_FILE: ${UGV_MQTT_KEY_CONTAINER_FILE:-}
      UGV_MQTT_SESSION_EXPIRY_SECONDS: ${UGV_MQTT_SESSION_EXPIRY_SECONDS:-86400}
      UGV_MQTT_KEEPALIVE_SECONDS: ${UGV_MQTT_KEEPALIVE_SECONDS:-30}
      UGV_MQTT_CONNECT_TIMEOUT_MS: ${UGV_MQTT_CONNECT_TIMEOUT_MS:-5000}
      UGV_MQTT_MAX_PAYLOAD_BYTES: ${UGV_MQTT_MAX_PAYLOAD_BYTES:-1048576}
      UGV_EQUIPMENT_SCHEMA_DIR: /source-schema
      UGV_DEVICE_ID: ${UGV_DEVICE_ID:-ugv}
      UGV_DATA_SCOPE_KEY: ${UGV_DATA_SCOPE_KEY:-airport-sim-ugv-01}
      UGV_ORIGIN_KIND: ${UGV_ORIGIN_KIND:-SIMULATION}
      UGV_SOURCE_KEY: ${UGV_SOURCE_KEY:-ugv-airport-sim-mqtt}
      UGV_PRODUCER_PIPELINE_KEY: ${UGV_PRODUCER_PIPELINE_KEY:-ugv-airport-sim-mqtt:canonical-v1}
      UGV_SCENARIO_ID: ${UGV_SCENARIO_ID:-airport}
      UGV_WORLD_EPOCH: ${UGV_WORLD_EPOCH:-airport-run-001}
      UGV_TRACKER_SESSION_KEY: ${UGV_TRACKER_SESSION_KEY:-airport-run-001:ugv}
      UGV_ANALYSIS_SPACE_KEY: ${UGV_ANALYSIS_SPACE_KEY:-airport-utm48n}
      UGV_ANALYSIS_SRID: ${UGV_ANALYSIS_SRID:-32648}
      UGV_MQTT_ARRIVAL_TIME_UNCERTAINTY_MS: ${UGV_MQTT_ARRIVAL_TIME_UNCERTAINTY_MS:-1000}
      UGV_MQTT_INGEST_PORT: 3010
      GOWM_OBSERVATION_API_URL: http://observation-ingest:3002
    command: ["node", "dist/services/ugv-mqtt-ingest/src/index.js"]
    volumes:
      - ${UGV_EQUIPMENT_SCHEMA_DIR:-./config/ugv-source-schema}:/source-schema:ro
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${UGV_MQTT_INGEST_PORT:-3010}:3010"
    depends_on:
      migrate:
        condition: service_completed_successfully
      observation-ingest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3010/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    init: true

  stas:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://stas_app:${STAS_DB_PASSWORD:?set STAS_DB_PASSWORD in .env}@postgres:5432/gowm
      HOST: 0.0.0.0
      PORT: 8080
      SERVICE_VERSION: 0.1.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_POOL_MAX: ${STAS_DB_POOL_MAX:-20}
      DB_CONNECTION_TIMEOUT_MS: ${STAS_DB_CONNECTION_TIMEOUT_MS:-2000}
    command: ["node", "services/stas/dist/server.js"]
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${STAS_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/readyz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    init: true

  projection-worker:
    build: .
    environment:
      <<: *app-environment
      HISTORICAL_WORKER_DATABASE_URL: postgresql://gowm_history_worker_service:${HISTORICAL_WORKER_DB_PASSWORD:?set a distinct HISTORICAL_WORKER_DB_PASSWORD in .env}@postgres:5432/gowm
      HISTORICAL_PROJECTION_RETRY_DELAY_MS: ${HISTORICAL_PROJECTION_RETRY_DELAY_MS:-1000}
      HISTORICAL_PROJECTION_MAX_RETRY_DELAY_MS: ${HISTORICAL_PROJECTION_MAX_RETRY_DELAY_MS:-60000}
      HISTORICAL_PROJECTION_BACKOFF_MULTIPLIER: ${HISTORICAL_PROJECTION_BACKOFF_MULTIPLIER:-2}
    command: ["node", "dist/services/projection-worker/src/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    init: true

  world-mcp-server:
    build: .
    environment:
      <<: *app-environment
      MCP_PORT: 3001
    command: ["node", "dist/services/world-mcp-server/src/index.js", "--http"]
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-3001}:3001"
    depends_on:
      world-api:
        condition: service_healthy
      observation-ingest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    init: true

  simulator:
    build: .
    profiles: ["demo"]
    environment:
      <<: *app-environment
      SIM_VEHICLES: ${SIM_VEHICLES:-100}
      SIM_RATE_HZ: ${SIM_RATE_HZ:-1}
    command: ["node", "dist/simulator/src/index.js", "--continuous"]
    depends_on:
      observation-ingest:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gowm-postgres:
  gowm-mosquitto:
