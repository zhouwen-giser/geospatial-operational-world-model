name: ${COMPOSE_PROJECT_NAME:-gowm-wsgs-sample}

x-sample-image: &sample-image
  image: ${GOWM_WSGS_SAMPLE_IMAGE:-gowm-wsgs-sample:0.6.4}
  build:
    context: .
    dockerfile: Dockerfile

x-sample-hardening: &sample-hardening
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp
  networks:
    - sample-internal
  profiles:
    - grounding-core

x-provider-healthcheck: &provider-healthcheck
  test:
    - CMD
    - node
    - -e
    - fetch('http://127.0.0.1:'+process.env.PROVIDER_HEALTH_PORT+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
  interval: 3s
  timeout: 3s
  retries: 40
  start_period: 5s

x-bootstrap-dependency: &bootstrap-dependency
  sample-bootstrap:
    condition: service_completed_successfully

services:
  postgres:
    build:
      context: .
      dockerfile: database/Dockerfile
      args:
        MOBILITYDB_BASE_IMAGE: ${MOBILITYDB_BASE_IMAGE:-mobilitydb/mobilitydb:18-3.6-1.3@sha256:8409e3897e2b88561bef4374110c3da5f7ff56838a7745315f1c2f111305dd24}
        H3_PG_VERSION: 4.5.0
        PGROUTING_VERSION: 4.0.1
        PGROUTING_SOURCE_SHA256: 21c071983a682e048da28f0f211205a20f27ef3708c0b637b4e6e29994d7d699
    image: gowm-wsgs-sample-db:18-3.6-mobilitydb-1.3-h3-4.5.0-pgrouting-4.0.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gowm_wsgs_sample}
      POSTGRES_USER: gowm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the private sample env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - ${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-55463}:5432
    volumes:
      - gowm-wsgs-sample-db:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - test "$(head -1 "$${PGDATA}/postmaster.pid")" = 1 && pg_isready -U gowm -d "$${POSTGRES_DB}" && psql -U gowm -d "$${POSTGRES_DB}" -Atqc "SELECT count(*) FROM pg_available_extensions WHERE name IN ('postgis','mobilitydb','h3','h3_postgis','pgrouting')" | grep -qx 5
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: ${POSTGRES_SHM_SIZE:-1gb}
    stop_grace_period: 60s
    networks:
      - sample-internal
      - sample-debug
    profiles:
      - grounding-core

  sample-bootstrap:
    <<: [*sample-image, *sample-hardening]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - dist/scripts/bootstrap-wsgs-sample.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://gowm:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gowm_wsgs_sample}
      GATEWAY_REGISTRY_DATABASE_URL: postgresql://gowm_gateway_registry_service:${GATEWAY_REGISTRY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-gowm_wsgs_sample}
      ANALYSIS_SRID: "32650"
      ANALYSIS_SPACE_KEY: wsgs-sample-utm50n
      STAS_DB_PASSWORD: ${STAS_DB_PASSWORD:?set STAS_DB_PASSWORD}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD}
      GATEWAY_REGISTRY_DB_PASSWORD: ${GATEWAY_REGISTRY_DB_PASSWORD:?set GATEWAY_REGISTRY_DB_PASSWORD}
      SPATIAL_DB_PASSWORD: ${SPATIAL_DB_PASSWORD:?set SPATIAL_DB_PASSWORD}
      REFERENCE_DB_PASSWORD: ${REFERENCE_DB_PASSWORD:?set REFERENCE_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}
      EVIDENCE_DB_PASSWORD: ${EVIDENCE_DB_PASSWORD:?set EVIDENCE_DB_PASSWORD}
      VALIDATION_DB_PASSWORD: ${VALIDATION_DB_PASSWORD:?set VALIDATION_DB_PASSWORD}
      SAMPLE_LOADER_DB_PASSWORD: ${SAMPLE_LOADER_DB_PASSWORD:?set SAMPLE_LOADER_DB_PASSWORD}

  sample-loader:
    <<: [*sample-image, *sample-hardening]
    restart: "no"
    depends_on: *bootstrap-dependency
    command:
      - node
      - dist/scripts/sample-world/database-cli.js
      - load-db
    environment:
      NODE_ENV: production
      SAMPLE_LOADER_DATABASE_URL: postgresql://gowm_sample_loader_service:${SAMPLE_LOADER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-gowm_wsgs_sample}
      DATABASE_URL: postgresql://gowm_sample_loader_service:${SAMPLE_LOADER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-gowm_wsgs_sample}
      SAMPLE_WORLD_EPOCH: ${SAMPLE_WORLD_EPOCH:?set SAMPLE_WORLD_EPOCH}
      SAMPLE_WORLD_SEED: ${SAMPLE_WORLD_SEED:-gowm-wsgs-sample-world-v1}
      ANALYSIS_SRID: "32650"
      ANALYSIS_SPACE_KEY: wsgs-sample-utm50n
      SAMPLE_WORLD_GENERATED_DIRECTORY: /runtime/generated
      SAMPLE_WORLD_OUTPUT_DIRECTORY: /runtime/output
    volumes:
      - ./.runtime/wsgs-sample:/runtime
      - gowm-wsgs-sample-runtime:/var/lib/gowm-sample
    profiles:
      - sample-tools

  reference-catalog-provider:
    <<: [*sample-image, *sample-hardening]
    restart: unless-stopped
    depends_on: *bootstrap-dependency
    command:
      - node
      - dist/services/providers/grounding-catalog-provider/src/index.js
    environment:
      PROVIDER_TRANSPORT_SHARED_TOKEN: ${REFERENCE_CATALOG_PROVIDER_TRANSPORT_TOKEN:?set reference transport token}
      PROVIDER_HEALTH_PORT: "8090"
      GROUNDING_CATALOG_MODE: reference
      GROUNDING_CATALOG_PORT: "8090"
      GROUNDING_CATALOG_DATABASE_URL: postgresql://gowm_reference_service:${REFERENCE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-gowm_wsgs_sample}
      GROUNDING_CATALOG_CURSOR_HMAC_SECRET: ${GROUNDING_CURSOR_HMAC_SECRET:?set grounding cursor secret}
    healthcheck: *provider-healthcheck

  dataset-catalog-provider:
    <<: [*sample-image, *sample-hardening]
    restart: unless-stopped
    depends_on: *bootstrap-dependency
    command:
      - node
      - dist/services/providers/grounding-catalog-provider/src/index.js
    environment:
      PROVIDER_TRANSPORT_SHARED_TOKEN: ${DATASET_CATALOG_PROVIDER_TRANSPORT_TOKEN:?set dataset transport token}
      PROVIDER_HEALTH_PORT: "8091"
      GROUNDING_CATALOG_MODE: dataset
      GROUNDING_CATALOG_PORT: "8091"
      GROUNDING_CATALOG_DATABASE_URL: postgresql://gowm_catalog_service:${CATALOG_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-gowm_wsgs_sample}
      GROUNDING_CATALOG_CURSOR_HMAC_SECRET: ${GROUNDING_CURSOR_HMAC_SECRET:?set grounding cursor secret}
    healthcheck: *provider-healthcheck

  world-evidence-provider:
    <<: [*sample-image, *sample-hardening]
    restart: unless-stopped
    depends_on: *bootstrap-dependency
    command:
      - node
      - dist/services/providers/grounding-catalog-provider/src/index.js
    environment:
      PROVIDER_TRANSPORT_SHARED_TOKEN: ${WORLD_EVIDENCE_PROVIDER_TRANSPORT_TOKEN:?set evidence transport token}
      PROVIDER_HEALTH_PORT: "8093"
      GROUNDING_CATALOG_MODE: evidence
      GROUNDING_CATALOG_PORT: "8093"
      GROUNDING_CATALOG_DATABASE_URL: postgresql://gowm_evidence_service:${EVIDENCE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-gowm_wsgs_sample}
      GROUNDING_CATALOG_CURSOR_HMAC_SECRET: ${GROUNDING_CURSOR_HMAC_SECRET:?set grounding cursor secret}
    healthcheck: *provider-healthcheck

  spatial-provider-bridge:
    <<: [*sample-image, *sample-hardening]
    restart: unless-stopped
    depends_on: *bootstrap-dependency
    command:
      - node
      - dist/services/providers/spatial-provider-bridge/src/index.js
    environment:
      PROVIDER_TRANSPORT_SHARED_TOKEN: ${SPATIAL_PROVIDER_TRANSPORT_TOKEN:?set spatial transport token}
      PROVIDER_HEALTH_PORT: "8091"
      SPATIAL_DATABASE_URL: postgresql://gowm_spatial_service:${SPATIAL_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-gowm_wsgs_sample}
      SPATIAL_BRIDGE_PORT: "8091"
      SPATIAL_CURSOR_HMAC_SECRET: ${SPATIAL_CURSOR_HMAC_SECRET:?set spatial cursor secret}
      SPATIAL_POSTGIS_VERSION: ${SPATIAL_POSTGIS_VERSION:-3.6.4}
    healthcheck: *provider-healthcheck

  platform-validation-provider:
    <<: [*sample-image, *sample-hardening]
    restart: unless-stopped
    depends_on: *bootstrap-dependency
    command:
      - node
      - dist/services/providers/platform-validation-provider/src/server.js
    environment:
      PROVIDER_TRANSPORT_SHARED_TOKEN: ${PLATFORM_VALIDATION_PROVIDER_TRANSPORT_TOKEN:?set validation transport token}
      PROVIDER_HEALTH_PORT: "8095"
      PLATFORM_VALIDATION_DATABASE_URL: postgresql://platform_validation_provider:${VALIDATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-gowm_wsgs_sample}
      PLATFORM_VALIDATION_PORT: "8095"
    healthcheck: *provider-healthcheck

  world-capability-gateway:
    <<: *sample-image
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      sample-bootstrap:
        condition: service_completed_successfully
      reference-catalog-provider:
        condition: service_healthy
      dataset-catalog-provider:
        condition: service_healthy
      world-evidence-provider:
        condition: service_healthy
      spatial-provider-bridge:
        condition: service_healthy
      platform-validation-provider:
        condition: service_healthy
    command:
      - node
      - dist/services/gateway/world-capability-gateway/src/server.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://gowm_gateway_service:${GATEWAY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-gowm_wsgs_sample}
      GATEWAY_PROVIDER_REGISTRY_PATH: config/world-platform-gateway-registry.json
      GATEWAY_PORT: "8090"
      PROVIDER_HEALTH_PORT: "8090"
      GATEWAY_AUTH_SHARED_TOKEN: ${GOWM_WSGS_SAMPLE_TOKEN:?set GOWM_WSGS_SAMPLE_TOKEN}
      GATEWAY_AUTH_MODE: ${GATEWAY_AUTH_MODE:-SIGNED_DELEGATION_V1}
      GATEWAY_RUNTIME_PRINCIPAL_REF: ${GATEWAY_RUNTIME_PRINCIPAL_REF:-service:wsgs}
      GATEWAY_DATA_SCOPE_CLAIM: ${GATEWAY_DATA_SCOPE_CLAIM:-wsgs-demo}
      GATEWAY_DATASET_SCOPE_CLAIM: ${GATEWAY_DATASET_SCOPE_CLAIM:-wsgs-demo-main}
      GATEWAY_DELEGATION_ISSUER: ${GATEWAY_DELEGATION_ISSUER:-https://gowm.local/wsgs-sample}
      GATEWAY_DELEGATION_AUDIENCE: ${GATEWAY_DELEGATION_AUDIENCE:-gowm-world-gateway}
      GATEWAY_DELEGATION_PUBLIC_KEY: ${GATEWAY_DELEGATION_PUBLIC_KEY:?set generated delegation public key}
      GATEWAY_DELEGATION_MAX_TTL_SECONDS: ${GATEWAY_DELEGATION_MAX_TTL_SECONDS:-300}
      REFERENCE_CATALOG_PROVIDER_TRANSPORT_TOKEN: ${REFERENCE_CATALOG_PROVIDER_TRANSPORT_TOKEN}
      DATASET_CATALOG_PROVIDER_TRANSPORT_TOKEN: ${DATASET_CATALOG_PROVIDER_TRANSPORT_TOKEN}
      WORLD_EVIDENCE_PROVIDER_TRANSPORT_TOKEN: ${WORLD_EVIDENCE_PROVIDER_TRANSPORT_TOKEN}
      SPATIAL_PROVIDER_TRANSPORT_TOKEN: ${SPATIAL_PROVIDER_TRANSPORT_TOKEN}
      PLATFORM_VALIDATION_PROVIDER_TRANSPORT_TOKEN: ${PLATFORM_VALIDATION_PROVIDER_TRANSPORT_TOKEN}
      CRS_PROVIDER_TRANSPORT_TOKEN: ${CRS_PROVIDER_TRANSPORT_TOKEN}
      GEOMETRY_PROVIDER_TRANSPORT_TOKEN: ${GEOMETRY_PROVIDER_TRANSPORT_TOKEN}
      H3_ANALYSIS_PROVIDER_TRANSPORT_TOKEN: ${H3_ANALYSIS_PROVIDER_TRANSPORT_TOKEN}
      H3_INTERACTIVE_PROVIDER_TRANSPORT_TOKEN: ${H3_INTERACTIVE_PROVIDER_TRANSPORT_TOKEN}
      NETWORK_PROVIDER_TRANSPORT_TOKEN: ${NETWORK_PROVIDER_TRANSPORT_TOKEN}
      OPERATIONAL_REALITY_PROVIDER_TRANSPORT_TOKEN: ${OPERATIONAL_REALITY_PROVIDER_TRANSPORT_TOKEN}
      COVERAGE_PROVIDER_TRANSPORT_TOKEN: ${COVERAGE_PROVIDER_TRANSPORT_TOKEN}
      ROUTE_PROVIDER_TRANSPORT_TOKEN: ${ROUTE_PROVIDER_TRANSPORT_TOKEN}
      SITUATION_PROVIDER_TRANSPORT_TOKEN: ${SITUATION_PROVIDER_TRANSPORT_TOKEN}
      STAS_PROVIDER_TRANSPORT_TOKEN: ${STAS_PROVIDER_TRANSPORT_TOKEN}
    ports:
      - ${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-18063}:8090
    volumes:
      - gowm-wsgs-sample-runtime:/var/lib/gowm-sample
    networks:
      - sample-internal
      - sample-edge
    profiles:
      - grounding-core
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8090/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

networks:
  sample-internal:
    internal: true
  sample-debug: {}
  sample-edge: {}

volumes:
  gowm-wsgs-sample-db:
    name: ${GOWM_WSGS_SAMPLE_DB_VOLUME:-gowm-wsgs-sample-db}
  gowm-wsgs-sample-runtime:
    name: ${GOWM_WSGS_SAMPLE_RUNTIME_VOLUME:-gowm-wsgs-sample-runtime}
